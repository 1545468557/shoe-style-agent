[project]
name = "shoe-style-agent"
version = "0.1.0"
description = "鞋服智能设计 Agent（款式工场）· 阶段 2 后端 MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "openai>=1.50",
    "httpx>=0.27",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
